# Every day: the published package repository as a WormOS system sees it
# (signed index, every package present with the size and SHA-256 the index
# gives, dependencies, source archives). A failure here means systems
# cannot install or upgrade.
name: Package repository

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the package repository
    if: github.repository == 'CrimsonMac/WormOS'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-package-repo.sh
