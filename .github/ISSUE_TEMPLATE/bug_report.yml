name: Bug report
description: Something in WormOS does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here: see SECURITY.md (private reporting).
  - type: input
    id: version
    attributes:
      label: WormOS version
      description: "The output of: grep VERSION_ID /etc/os-release"
      placeholder: VERSION_ID=1.10
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - Installed on a disk
        - Live from the ISO
        - The qcow2 image (QEMU, virt-manager)
        - Other virtual machine
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - WormOS
        - WormOS Barebones
        - WormOS Amnesia
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Error messages, `worm status`, or the relevant part of `logread`.
      render: text
