# WormOS: iwd connects to Wi-Fi networks and sets up their addresses.
[General]
# Its own DHCP client, so a Wi-Fi network works without anything else.
EnableNetworkConfiguration=true
# A random MAC address for every network, new at every start (scans always
# use random addresses): networks cannot recognise this machine.
AddressRandomization=once
AddressRandomizationRange=full

[Network]
# DNS stays with the local encrypted resolver (unbound): the network's
# DNS servers are not used.
NameResolvingService=none
EnableIPv6=true
