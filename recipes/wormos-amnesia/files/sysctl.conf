# WormOS Amnesia: stricter settings on top of WormOS's (50-wormos.conf).

# No TCP timestamps: they would tell Tor's first relay (or anyone watching
# the network) more about this computer's clock and uptime.
net.ipv4.tcp_timestamps = 0

# No core dumps: a crashing program's memory (pages, passwords, keys) is
# never written into a file, not even into memory.
kernel.core_pattern = |/bin/false
